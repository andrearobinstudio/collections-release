<!-- andrea robin studio · collectors' list block (direct paste into a Format code/embed block, above the signup form) -->
<link href="https://fonts.googleapis.com/css2?family=Asap:wght@400;500&display=swap" rel="stylesheet">
<div class="ars">
  <p class="ars-title">six studies</p>
  <p class="ars-sub">mid-november, for the list first</p>
  <div class="ars-count" id="ars-count" hidden>
    <span><span id="ars-d">00</span><small>d</small></span>
    <span><span id="ars-h">00</span><small>h</small></span>
    <span><span id="ars-m">00</span><small>m</small></span>
    <span><span id="ars-s">00</span><small>s</small></span>
  </div>
  <p class="ars-live" id="ars-live" hidden>open to the list. check your inbox.</p>
  <p class="ars-foot">collection 01, spring 2027</p>
</div>
<style>
  .ars{max-width:28rem;margin:0 auto 2rem;padding:16px;text-align:center;line-height:1.5;color:#1a1a1a;font-family:"Asap",sans-serif;font-weight:400}
  .ars p{margin:0}
  .ars-title{font-size:1.125rem;font-weight:500;margin-bottom:.25rem}
  .ars-sub{font-size:.95rem;opacity:.65}
  .ars-count{display:flex;justify-content:center;gap:1.25rem;margin-top:1.5rem;font-size:.95rem;font-variant-numeric:tabular-nums}
  .ars-count small{opacity:.5;margin-left:.15rem}
  .ars-count[hidden],.ars-live[hidden]{display:none}
  .ars-live{margin-top:1.5rem!important;font-size:.95rem}
  .ars-foot{margin-top:2.5rem!important;font-size:.85rem;opacity:.5}
</style>
<script>
(function(){
  var ARS_RELEASE = null; // e.g. "2026-11-14T10:00:00-08:00" to switch the countdown on
  if(!ARS_RELEASE) return;
  var end = new Date(ARS_RELEASE).getTime();
  var box = document.getElementById('ars-count'), live = document.getElementById('ars-live');
  function pad(n){return String(n).padStart(2,'0');}
  function tick(){
    var t = end - Date.now();
    if(t <= 0){ box.hidden = true; live.hidden = false; return; }
    box.hidden = false;
    document.getElementById('ars-d').textContent = pad(Math.floor(t/864e5));
    document.getElementById('ars-h').textContent = pad(Math.floor(t/36e5)%24);
    document.getElementById('ars-m').textContent = pad(Math.floor(t/6e4)%60);
    document.getElementById('ars-s').textContent = pad(Math.floor(t/1e3)%60);
    setTimeout(tick, 1000);
  }
  tick();
})();
</script>
